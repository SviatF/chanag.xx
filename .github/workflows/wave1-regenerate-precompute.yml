# One-off audit repair job. It is scoped exclusively to the Wave 1 PR branch.
name: Wave 1 regenerate Muhurat snapshots
on:
  push:
    branches:
      - "audit/wave1-panchang-choghadiya-integrity-20261013"
    paths:
      - ".github/workflows/wave1-regenerate-precompute.yml"
permissions:
  contents: write
jobs:
  rebuild:
    if: github.ref == 'refs/heads/audit/wave1-panchang-choghadiya-integrity-20261013'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package.json
      - name: Install project dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: Regenerate all changed monthly Muhurat inputs (do not suppress astronomical errors)
        run: npm run precompute:muhurat
      - name: Validate the exact output of the new engine
        run: npm run verify:muhurat-precompute
      - name: Commit only regenerated Muhurat shard data on the PR branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated/muhurat-panchang-shards.ts generated/muhurat-panchang-shard-*.ts
          if git diff --cached --quiet; then
            echo "No generated shard changes"
          else
            git commit -m "build(audit): regenerate 48 Muhurat month shards using verified Wave 1 engine"
            git push origin "HEAD:refs/heads/audit/wave1-panchang-choghadiya-integrity-20261013"
          fi
