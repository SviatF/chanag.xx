name: Wave 3B V3 Snapshot Regeneration
on:
  push:
    branches:
      - feat/wave3b-muhurat-v3-snapshots-20261013
    paths:
      - "lib/muhurat-build-data-schema.ts"
      - "scripts/precompute-muhurat.ts"
      - ".github/workflows/wave3b-v3-regenerate.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: wave3b-v3-${{ github.ref }}
  cancel-in-progress: false
jobs:
  regenerate-v3:
    if: github.ref_name == 'feat/wave3b-muhurat-v3-snapshots-20261013'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package.json
      - run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: Regenerate all 48 exact-transition monthly shards
        run: npm run precompute:muhurat
      - name: Check V3 signatures before committing
        run: npm run verify:muhurat-precompute
      - name: Check changed generated contents and known shard count
        shell: bash
        run: |
          test "$(find generated -maxdepth 1 -name 'muhurat-panchang-shard-????-??.ts' | wc -l)" -eq 48
          git status --short generated
      - name: Commit generated V3 data to this feature branch only
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated/muhurat-panchang-shards.ts generated/muhurat-panchang-shard-*.ts
          if ! git diff --cached --quiet; then
            git commit -m "data(muhurat): V3 dated lunar transitions for 48 month shards"
            git push origin HEAD:feat/wave3b-muhurat-v3-snapshots-20261013
          fi
