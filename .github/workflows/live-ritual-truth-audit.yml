name: Live Ritual Truth (read only)
on:
  workflow_dispatch:
  schedule:
    - cron: '25 3 * * *'
permissions:
  contents: read
jobs:
  verify-live-wedding-closures:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check six production Marathi wedding HTML routes
        run: node scripts/live-ritual-truth-audit.mjs --strict
      - name: Upload evidence (including failures)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: panchvani-live-ritual-truth
          path: artifacts/live-ritual-truth-report.json
          retention-days: 30
          if-no-files-found: warn
