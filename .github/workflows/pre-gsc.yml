name: Pre-GSC Live Audit

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"
  push:
    branches: [main]
    paths:
      - ".github/workflows/pre-gsc.yml"
      - "scripts/pre-gsc-audit.mjs"
      - "app/robots.ts"
      - "app/sitemap.xml/**"
      - "app/sitemap-*.xml/**"

permissions:
  contents: read

jobs:
  live-indexation-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify Stage 5 owner pages are live
        run: |
          node --input-type=module <<'NODE'
          const urls=[
            "https://panchvani.com/muhurat",
            "https://panchvani.com/tools/choghadiya",
            "https://panchvani.com/tools/hindu-baby-names"
          ];
          for(const url of urls){
            const response=await fetch(url,{redirect:"manual",headers:{"user-agent":"Panchvani-PreGSC-Audit/1.0"}});
            if(response.status!==200)throw new Error(`${url} returned HTTP ${response.status}`);
            const html=await response.text();
            const canonicalTag=[...html.matchAll(/<link\b[^>]*>/gi)].find(match=>/rel=["'][^"']*canonical/i.test(match[0]));
            const href=canonicalTag?.[0].match(/href=["']([^"']+)/i)?.[1];
            if(!href)throw new Error(`${url} has no canonical link`);
            const normalized=new URL(href,url).toString().replace(/\/$/,"");
            if(normalized!==url)throw new Error(`${url} canonical is ${normalized}`);
            console.log(`OK ${url}`);
          }
          NODE

      - name: Run full live sitemap and indexation audit
        env:
          AUDIT_BASE_URL: https://panchvani.com
          AUDIT_CONCURRENCY: "6"
          AUDIT_TIMEOUT_MS: "15000"
        run: node scripts/pre-gsc-audit.mjs

      - name: Upload pre-GSC audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pre-gsc-audit
          path: |
            artifacts/pre-gsc-audit.json
            artifacts/pre-gsc-audit.md
          if-no-files-found: warn
          retention-days: 14
