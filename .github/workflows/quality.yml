name: Panchang Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package.json

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Verify committed Muhurat build data
        run: npm run verify:muhurat-precompute

      - name: Check Cloudflare vinext compatibility
        continue-on-error: true
        run: npx --yes vinext@1.0.0-beta.9 check

      - name: Run Panchang regression tests
        run: npm test

      - name: Audit independent Guru Shukra Asta evidence (research-only)
        run: npm run audit:asta-evidence

      - name: Upload Asta evidence gap report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asta-evidence-gap-report
          path: artifacts/asta-evidence-audit.json
          if-no-files-found: warn

      - name: Compare Asta geometric models (research only)
        run: npm run research:asta-models

      - name: Upload non-ceremonial Asta model residual report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asta-wave3o-model-comparison
          path: artifacts/asta-observer-model-comparison.json
          if-no-files-found: warn

      - name: Verify observer sky geometry and atmospheric sensitivity (research only)
        run: npm run research:asta-visibility

      - name: Upload observer sky visibility diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asta-wave3p-visibility-geometry
          path: artifacts/asta-heliacal-visibility-research.json
          if-no-files-found: warn

      - name: Native heliacal event search with atmospheric sensitivity (research only)
        timeout-minutes: 7
        run: npm run research:asta-heliacal -- --report=artifacts/asta-heliacal-deep.json

      - name: Upload native heliacal sensitivity report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asta-wave3p-heliacal-sensitivity
          path: artifacts/asta-heliacal-deep.json
          if-no-files-found: warn

      - name: Reconcile published Asta conventions and visibility scenario uncertainty (research only)
        run: npm run audit:asta-methodology

      - name: Upload Wave 3Q methodology and uncertainty report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asta-wave3q-methodology-uncertainty
          path: artifacts/asta-wave3q-uncertainty-crosswalk.json
          if-no-files-found: warn

      - name: Audit fixed-angle publication independence and NPT/IST normalization (research-only)
        run: npm run audit:asta-angular-sources

      - name: Upload Wave 3R fixed-angle publisher evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asta-wave3r-independent-sources
          path: artifacts/asta-wave3r-independent-angular-sources.json
          if-no-files-found: warn

      - name: Verify city-specific Asta source URL replay and locality conflicts (research only)
        run: npm run audit:asta-city-sources

      - name: Upload Asta city source reproducibility failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asta-wave3s-city-source-reproducibility
          path: artifacts/asta-wave3s-local-source-reproducibility.json
          if-no-files-found: warn

      - name: Audit Wedding Griha Festival and Vrat ritual evidence boundaries (research only)
        run: npm run audit:ritual-evidence

      - name: Upload Wave 3T ritual source and observance matrix
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wave3t-ritual-evidence-matrix
          path: artifacts/wave3t-ritual-evidence-matrix.json
          if-no-files-found: warn

      - name: Verify full precomputed Muhurat lunar and Karana integrity
        run: npm run audit:muhurat -- --report=wave3t-ritual-window-truth.json

      - name: Upload comprehensive Muhurat truth report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wave3t-full-muhurat-truth
          path: wave3t-ritual-window-truth.json
          if-no-files-found: warn

      - name: Verify Festival dates and local ritual rule engines across active cities
        run: npm run audit:festivals

      - name: Upload comprehensive Festival truth report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wave3t-full-festival-truth
          path: artifacts/festival-truth-audit.json
          if-no-files-found: warn

      - name: Independently compare UT versus ET sunrise Tithi and Janmashtami convention (research-only)
        run: npm run audit:vrat-time-scale

      - name: Upload Wave 3U UT-ET Vrat and Janmashtami diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wave3u-ut-et-janmashtami
          path: artifacts/wave3u-ut-et-janmashtami-diagnostic.json
          if-no-files-found: warn

      - name: Verify UT-correct V5 daily Panchang, yearly Vrat and source-disputed dawn boundaries
        run: npm run audit:boundary-integrity

      - name: Upload source-disputed astronomical boundary comparison (research only)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wave3w-boundary-integrity
          path: artifacts/wave3w-boundary-evidence-consistency.json
          if-no-files-found: warn

      - name: Build Next.js reference
        run: npm run build:next

      - name: Audit rendered content quality
        shell: bash
        run: |
          npm run start -- -p 3000 > /tmp/panchvani-next.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          READY=0
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null; then
              READY=1
              break
            fi
            sleep 1
          done
          if [ "$READY" != "1" ]; then
            cat /tmp/panchvani-next.log
            exit 1
          fi
          node scripts/verify-reviewed-muhurat-ssr.mjs --base-url=http://127.0.0.1:3000
          npm run audit:content -- --base-url=http://127.0.0.1:3000 --report=content-quality-report.json --concurrency=10 || true
          node scripts/content-quality-gate.mjs content-quality-report.json

      - name: Upload content quality report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: content-quality-report
          path: content-quality-report.json
          if-no-files-found: warn

      - name: Build Cloudflare vinext bundle
        run: npm run build
