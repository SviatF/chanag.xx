name: Panchang Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package.json

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Verify committed Muhurat build data
        run: npm run verify:muhurat-precompute

      - name: Check Cloudflare vinext compatibility
        continue-on-error: true
        run: npx --yes vinext@1.0.0-beta.9 check

      - name: Run Panchang regression tests
        run: npm test

      - name: Build Next.js reference
        run: npm run build:next

      - name: Build Cloudflare vinext bundle
        run: npm run build

      - name: Smoke Muhurat shard and live fallback on Cloudflare preview
        if: github.event_name == 'pull_request' && github.head_ref == 'feat/muhurat-sharded-precompute'
        run: |
          base="https://feat-muhurat-sharded-precompute-chanag-xx.oleg22777.workers.dev"
          for path in \
            "/muhurat/wedding/2026/09/varanasi" \
            "/muhurat/griha-pravesh/2027/01/patna" \
            "/muhurat/wedding/2027/02/delhi"
          do
            echo "smoke: $path"
            curl --fail --silent --show-error --location \
              --retry 12 --retry-delay 10 --retry-all-errors --max-time 60 \
              --output /dev/null "$base$path"
          done
