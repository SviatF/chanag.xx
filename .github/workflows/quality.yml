name: Panchang Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package.json

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Verify committed Muhurat build data
        run: npm run verify:muhurat-precompute

      - name: Check Cloudflare vinext compatibility
        continue-on-error: true
        run: npx --yes vinext@1.0.0-beta.9 check

      - name: Run Panchang regression tests
        run: npm test

      - name: Audit independent Guru Shukra Asta evidence (research-only)
        run: npm run audit:asta-evidence

      - name: Upload Asta evidence gap report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asta-evidence-gap-report
          path: artifacts/asta-evidence-audit.json
          if-no-files-found: warn

      - name: Compare Asta geometric models (research only)
        run: npm run research:asta-models

      - name: Upload non-ceremonial Asta model residual report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asta-wave3o-model-comparison
          path: artifacts/asta-observer-model-comparison.json
          if-no-files-found: warn

      - name: Verify observer sky geometry and atmospheric sensitivity (research only)
        run: npm run research:asta-visibility

      - name: Upload observer sky visibility diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asta-wave3p-visibility-geometry
          path: artifacts/asta-heliacal-visibility-research.json
          if-no-files-found: warn

      - name: Native heliacal event search with atmospheric sensitivity (research only)
        timeout-minutes: 7
        run: npm run research:asta-heliacal -- --report=artifacts/asta-heliacal-deep.json

      - name: Upload native heliacal sensitivity report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asta-wave3p-heliacal-sensitivity
          path: artifacts/asta-heliacal-deep.json
          if-no-files-found: warn

      - name: Reconcile published Asta conventions and visibility scenario uncertainty (research only)
        run: npm run audit:asta-methodology

      - name: Upload Wave 3Q methodology and uncertainty report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asta-wave3q-methodology-uncertainty
          path: artifacts/asta-wave3q-uncertainty-crosswalk.json
          if-no-files-found: warn

      - name: Audit fixed-angle publication independence and NPT/IST normalization (research-only)
        run: npm run audit:asta-angular-sources

      - name: Upload Wave 3R fixed-angle publisher evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asta-wave3r-independent-sources
          path: artifacts/asta-wave3r-independent-angular-sources.json
          if-no-files-found: warn

      - name: Verify city-specific Asta source URL replay and locality conflicts (research only)
        run: npm run audit:asta-city-sources

      - name: Upload Asta city source reproducibility failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asta-wave3s-city-source-reproducibility
          path: artifacts/asta-wave3s-local-source-reproducibility.json
          if-no-files-found: warn

      - name: Audit Wedding Griha Festival and Vrat ritual evidence boundaries (research only)
        run: npm run audit:ritual-evidence

      - name: Upload Wave 3T ritual source and observance matrix
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wave3t-ritual-evidence-matrix
          path: artifacts/wave3t-ritual-evidence-matrix.json
          if-no-files-found: warn

      - name: Verify full precomputed Muhurat lunar and Karana integrity
        run: npm run audit:muhurat -- --report=wave3t-ritual-window-truth.json

      - name: Upload comprehensive Muhurat truth report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wave3t-full-muhurat-truth
          path: wave3t-ritual-window-truth.json
          if-no-files-found: warn

      - name: Verify Festival dates and local ritual rule engines across active cities
        run: npm run audit:festivals

      - name: Upload comprehensive Festival truth report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wave3t-full-festival-truth
          path: artifacts/festival-truth-audit.json
          if-no-files-found: warn

      - name: Independently compare UT versus ET sunrise Tithi and Janmashtami convention (research-only)
        run: npm run audit:vrat-time-scale

      - name: Upload Wave 3U UT-ET Vrat and Janmashtami diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wave3u-ut-et-janmashtami
          path: artifacts/wave3u-ut-et-janmashtami-diagnostic.json
          if-no-files-found: warn

      - name: Verify UT-correct V5 daily Panchang, yearly Vrat and source-disputed dawn boundaries
        run: npm run audit:boundary-integrity

      - name: Upload source-disputed astronomical boundary comparison (research only)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wave3w-boundary-integrity
          path: artifacts/wave3w-boundary-evidence-consistency.json
          if-no-files-found: warn

      - name: Check Ekadashi sunrise, arunodaya, Dwadashi and Janmashtami method boundaries (research only)
        run: npm run audit:ekadashi-observance

      - name: Upload Wave 3Z source and astronomical tradition gap report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wave3z-ekadashi-tradition
          path: artifacts/wave3z-ekadashi-tradition-parana-evidence.json
          if-no-files-found: warn

      - name: Reconcile Patna exact UT sunrise convention and eight Vedha research cases
        run: npm run audit:sunrise-conventions

      - name: Upload Wave 3AB sunrise-source method discrepancy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wave3ab-patna-convention-differential
          path: artifacts/wave3ab-patna-method-reconciliation.json
          if-no-files-found: warn

      - name: Compare independent Sun/Moon ephemeris for Patna and Vedha
        run: npm run audit:independent-astronomy

      - name: Upload Wave 3AC independent model proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wave3ac-independent-astronomy-evidence
          path: artifacts/wave3ac-independent-astronomy-evidence.json
          if-no-files-found: warn

      - name: Prepare Python JPL oracle runtime
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install research-only Skyfield
        run: python -m pip install --disable-pip-version-check "skyfield==1.55"

      - name: Download JPL DE440s kernel for independent reference
        timeout-minutes: 5
        shell: bash
        run: |
          mkdir -p artifacts/jpl-kernels
          KERNEL="artifacts/jpl-kernels/de440s.bsp"
          if ! curl -fLSs --retry 3 --retry-delay 2 --connect-timeout 20 --max-time 180 "https://ssd.jpl.nasa.gov/ftp/eph/planets/bsp/de440s.bsp" -o "$KERNEL"; then
            echo "JPL SSD primary download unavailable, trying NAIF mirror"
            curl -fLSs --retry 3 --retry-delay 2 --connect-timeout 20 --max-time 180 "https://naif.jpl.nasa.gov/pub/naif/generic_kernels/spk/planets/de440s.bsp" -o "$KERNEL"
          fi
          test "$(head -c 7 "$KERNEL")" = "DAF/SPK"
          test "$(stat -c %s "$KERNEL")" -gt 25000000
          echo "Downloaded JPL DE440s SHA-256:"
          sha256sum "$KERNEL"
          echo "c1c7feeab882263fc493a9d5a5b2ddd71b54826cdf65d8d17a76126b260a49f2  $KERNEL" | sha256sum --check --status

      - name: Export checked Swiss UT source clocks for JPL comparison
        run: npm run audit:jpl-swiss-baseline

      - name: Calculate JPL DE440s Patna, other disputed dawn boundaries and eight Vedha cases
        timeout-minutes: 5
        run: python scripts/wave3ad-jpl-de440s-oracle.py --kernel=artifacts/jpl-kernels/de440s.bsp --expected-sha256=c1c7feeab882263fc493a9d5a5b2ddd71b54826cdf65d8d17a76126b260a49f2

      - name: Upload Wave 3AD third-ephemeris comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wave3ad-jpl-de440s-third-ephemeris
          path: |
            artifacts/wave3ad-jpl-de440s-comparison.json
            artifacts/wave3ad-swiss-baseline.json
          if-no-files-found: warn

      - name: Exhaustively screen committed V5 city-day shards for sunrise-near Tithi
        timeout-minutes: 5
        run: npm run audit:near-sunrise-shards

      - name: Independently evaluate every near-sunrise V5 candidate using JPL DE440s
        timeout-minutes: 7
        run: python scripts/wave3ae-jpl-full-impact.py --kernel=artifacts/jpl-kernels/de440s.bsp --expected-sha256=c1c7feeab882263fc493a9d5a5b2ddd71b54826cdf65d8d17a76126b260a49f2

      - name: Upload Wave 3AE full committed-calendar model impact report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wave3ae-all-committed-city-days-jpl-impact
          path: |
            artifacts/wave3ae-swiss-shard-screen.json
            artifacts/wave3ae-jpl-full-impact.json
          if-no-files-found: error

      - name: Generate JPL DE440s 6-degree Tithi and Karana canary roots for 2025–2030
        timeout-minutes: 5
        run: python scripts/wave3af-build-jpl-tithi-table.py --kernel=artifacts/jpl-kernels/de440s.bsp

      - name: Transport SHA-pinned JPL table into reviewed repository asset
        run: python scripts/wave3ag-emit-verified-asset.py

      - name: Scan all supported cities and all 2026–2028 daily dawn states with V6 canary
        timeout-minutes: 8
        run: npm run audit:jpl-v6-all-dynamic-city-days

      - name: Publish Wave 3AF global JPL roots and dynamic-city migration impact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wave3af-v6-global-jpl-tithi-karana-and-dynamic-impact
          path: |
            artifacts/wave3af-jpl-global-tithi-transitions.json
            artifacts/wave3af-dynamic-v6-canary-impact.json
          if-no-files-found: error

      - name: Build Next.js reference
        run: npm run build:next

      - name: Audit rendered content quality
        shell: bash
        run: |
          npm run start -- -p 3000 > /tmp/panchvani-next.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          READY=0
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null; then
              READY=1
              break
            fi
            sleep 1
          done
          if [ "$READY" != "1" ]; then
            cat /tmp/panchvani-next.log
            exit 1
          fi
          node scripts/verify-reviewed-muhurat-ssr.mjs --base-url=http://127.0.0.1:3000
          npm run audit:content -- --base-url=http://127.0.0.1:3000 --report=content-quality-report.json --concurrency=10 || true
          node scripts/content-quality-gate.mjs content-quality-report.json

      - name: Upload content quality report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: content-quality-report
          path: content-quality-report.json
          if-no-files-found: warn

      - name: Build Cloudflare vinext bundle
        run: npm run build
