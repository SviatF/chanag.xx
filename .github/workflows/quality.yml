name: Panchang Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package.json

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Verify committed Muhurat build data
        run: npm run verify:muhurat-precompute

      - name: Check Cloudflare vinext compatibility
        continue-on-error: true
        run: npx --yes vinext@1.0.0-beta.9 check

      - name: Run Panchang regression tests
        run: npm test

      - name: Build Next.js reference
        run: npm run build:next

      - name: Audit rendered content quality
        shell: bash
        run: |
          npm run start -- -p 3000 > /tmp/panchvani-next.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          READY=0
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null; then
              READY=1
              break
            fi
            sleep 1
          done
          if [ "$READY" != "1" ]; then
            cat /tmp/panchvani-next.log
            exit 1
          fi
          npm run audit:content -- --base-url=http://127.0.0.1:3000 --report=content-quality-report.json --concurrency=10

      - name: Upload content quality report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: content-quality-report
          path: content-quality-report.json
          if-no-files-found: warn

      - name: Build Cloudflare vinext bundle
        run: npm run build
