name: Panchang Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package.json

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Verify committed Muhurat build data
        run: npm run verify:muhurat-precompute

      - name: Check Cloudflare vinext compatibility
        continue-on-error: true
        run: npx --yes vinext@1.0.0-beta.9 check

      - name: Run Panchang regression tests
        run: npm test

      - name: Build Next.js reference
        run: npm run build:next

      - name: Build Cloudflare vinext bundle
        run: npm run build

      - name: Smoke-test Muhurat Cloudflare preview
        if: github.event_name == 'pull_request' && github.head_ref == 'feat/muhurat-precomputed-datasets'
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          slug=$(printf '%s' "$HEAD_REF" | tr '[:upper:]' '[:lower:]' | sed -E 's#[/_]+#-#g; s#[^a-z0-9-]+#-#g; s#^-+##; s#-+$##')
          base="https://${slug}-chanag-xx.oleg22777.workers.dev"
          check_page() {
            path="$1"
            needle="$2"
            for attempt in 1 2 3 4 5 6; do
              body=$(curl -fsSL --max-time 45 "$base$path") && printf '%s' "$body" | grep -Fq "$needle" && return 0
              sleep 5
            done
            echo "::error::Preview smoke failed for $path"
            exit 1
          }
          check_page "/muhurat/wedding/2026/09" "Wedding Muhurat"
          check_page "/muhurat/griha-pravesh/2026/09/ahmedabad" "Griha Pravesh Muhurat"
          check_page "/muhurat/vehicle-purchase/2026/09/delhi" "Vehicle Purchase Muhurat"
