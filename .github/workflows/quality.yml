name: Panchang Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package.json

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Repair Muhurat build artifact on PR branch
        if: github.event_name == 'pull_request'
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          git fetch origin "$HEAD_REF"
          git checkout -B "$HEAD_REF" "origin/$HEAD_REF"
          npm run precompute:muhurat
          if ! git diff --quiet -- generated/; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add generated/
            git commit -m "Regenerate Muhurat precompute artifact"
            git push origin HEAD:"$HEAD_REF"
          fi

      - name: Verify committed Muhurat build data
        run: npm run verify:muhurat-precompute

      - name: Check Cloudflare vinext compatibility
        continue-on-error: true
        run: npx --yes vinext@1.0.0-beta.9 check

      - name: Run Panchang regression tests
        run: npm test

      - name: Build Next.js reference
        run: npm run build:next

      - name: Build Cloudflare vinext bundle
        run: npm run build
