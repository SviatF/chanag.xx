name: Panchang Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package.json

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Check Cloudflare vinext compatibility
        continue-on-error: true
        run: npx --yes vinext@1.0.0-beta.9 check

      - name: Run Panchang regression tests
        run: npm test

      - name: Build Next.js
        run: npm run build
