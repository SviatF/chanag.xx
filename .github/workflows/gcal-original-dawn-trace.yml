name: PANCHVANI Original GCal Dawn Trace — remaining research disagreements
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/gcal-original-dawn-trace.ps1"
      - ".github/workflows/gcal-original-dawn-trace.yml"
permissions:
  contents: read
  actions: read
concurrency:
  group: original-gcal-dawn-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  original-dawn-trace:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned 908 city-year GCal native source and city manifest
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: gh run download 40515382389 -R ${{ github.repository }} -n gcal-native-all-city-years -D artifacts/native
      - name: Fetch independently verified GCal 454-city disagreement casebook
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: gh run download 40682308483 -R ${{ github.repository }} -n independent-454-aggregate-report -D artifacts/gcal-evidence
      - name: Replay pinned original GCal 11 source for each remaining mismatch and collect sunrise, Arunodaya and Nakshatra XML
        shell: pwsh
        run: ./scripts/gcal-original-dawn-trace.ps1
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gcal-original-dawn-mismatch-raw-xml
          path: artifacts/gcal-original-dawn-trace/original-gcal-dawn-trace.json
          if-no-files-found: error
          retention-days: 30
