name: Wave 3V One-Time Exact Label Diff Review
on:
  push:
    branches: [research/wave3v-ut-correct-full-shard-migration-20261014]
    paths:
      - ".github/workflows/wave3v-one-time-diff-review.yml"
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/wave3v-ut-correct-full-shard-migration-20261014
      - uses: actions/checkout@v4
        with:
          ref: main
          path: original
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Diff historical V4 against UT-correct V5 by exact date and city
        run: node scripts/wave3v-shard-migration-diff.mjs --before=original/generated --after=generated
      - name: Preserve reviewer report only
        uses: actions/upload-artifact@v4
        with:
          name: wave3v-exact-tithi-changes
          path: artifacts/wave3v-shard-migration-diff.json
          if-no-files-found: error
