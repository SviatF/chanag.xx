name: PANCHVANI Native GCal Binary Oracle (research only)
on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/gcal-native-oracle.yml"
      - "scripts/gcal-native-oracle-smoke.mjs"
      - "docs/audits/GCAL_NATIVE_BINARY_ORACLE_2026-10-27.md"
jobs:
  native-gcal-windows:
    runs-on: windows-2022
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Fetch original upstream binary and verify Git blob
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path original-gcal, artifacts/gcal-native | Out-Null
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/gopaladasa/GCAL-for-Windows/9267f9fde9aefe2e60fb30c80a7ac9fc366fa585/gcal_11c/gcal.exe" -OutFile original-gcal/gcal.exe
          if ((git hash-object original-gcal/gcal.exe).Trim() -ne "1d20f6e0caf29b6293157d258d02287e4edf0481") { throw "Binary hash mismatch" }
      - name: "Direct native Windows execution for complete 2027 Delhi year"
        shell: pwsh
        timeout-minutes: 6
        run: |
          $exe = (Resolve-Path original-gcal/gcal.exe).Path
          $output = Join-Path (Get-Location) 'artifacts/gcal-native/delhi-2027.xml'
          & $exe -R calendar -L '28N37;77E12' -N Delhi -TZ '5:30' -SG '1-1-2027' -EC 365 -O $output
          if (!(Test-Path $output)) { throw "Original executable returned no calendar" }
          node scripts/gcal-native-oracle-smoke.mjs $output
          node scripts/gcal-native-xml-validation.mjs $output delhi 2027
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-gcal-2027-delhi-xml-proof
          path: artifacts/gcal-native/
          retention-days: 7
          if-no-files-found: warn
