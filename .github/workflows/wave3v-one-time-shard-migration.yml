name: Wave 3V One-Time UT Migration Shard Generator

on:
  push:
    branches: [research/wave3v-ut-correct-full-shard-migration-20261014]
    paths:
      - "lib/muhurat-build-data-schema.ts"

permissions:
  contents: write

concurrency:
  group: wave3v-shard-migration
  cancel-in-progress: true

jobs:
  calculate-and-commit-shards:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout exact source branch
        uses: actions/checkout@v4
        with:
          ref: research/wave3v-ut-correct-full-shard-migration-20261014
          persist-credentials: true
      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package.json
      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: Preserve committed old snapshots for audit-only diff
        run: cp -a generated /tmp/panchvani-before-3v
      - name: Generate all UT-correct Muhurat month shards
        timeout-minutes: 80
        run: npm run precompute:muhurat
      - name: Verify exactly the committed versioned shard set
        run: npm run verify:muhurat-precompute
      - name: Audit source-calendar differential against previous snapshots
        run: node scripts/wave3v-shard-migration-diff.mjs --before=/tmp/panchvani-before-3v --after=generated
      - name: Upload ONLY audit summary (never shard files)
        uses: actions/upload-artifact@v4
        with:
          name: wave3v-shard-diff-report
          path: artifacts/wave3v-shard-migration-diff.json
          if-no-files-found: error
      - name: Commit updated precompute shards to PR branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated/muhurat-panchang-shards.ts generated/muhurat-panchang-shard-*.ts
          if git diff --cached --quiet; then
            echo "No generated changes; expected version bump to produce updated shards"
            exit 1
          fi
          git commit -m "Wave 3V: regenerate 48 synchronized UT-correct V5 Muhurat shards"
          git push origin HEAD:research/wave3v-ut-correct-full-shard-migration-20261014
