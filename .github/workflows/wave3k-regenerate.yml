name: One-time Wave 3K V4 Muhurat regeneration
on:
  push:
    branches:
      - fix/wave3k-wedding-vishti-karana-window-exclusion-20261013
    paths:
      - ".github/workflows/wave3k-regenerate.yml"
permissions:
  contents: write
jobs:
  regenerate:
    if: github.ref_name == 'fix/wave3k-wedding-vishti-karana-window-exclusion-20261013'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package.json
      - run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: Recalculate V4 monthly shards using Swiss Ephemeris
        run: npm run precompute:muhurat
      - name: Verify all 48 shards and full dated Karana evidence
        run: npm run verify:muhurat-precompute
      - name: Commit only regenerated shard data to feature branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated/muhurat-panchang-shards.ts generated/muhurat-panchang-shard-*.ts
          if ! git diff --cached --quiet; then
            git commit -m "data(muhurat): regenerate 48 V4 shards with dated Karana transitions"
            git push origin HEAD:fix/wave3k-wedding-vishti-karana-window-exclusion-20261013
          fi
